<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>noid faces</title>
        <link rel="stylesheet" href="/style.css" />
        <script type="importmap">
            {
                "imports": {
                    "preact": "/vendor/preact.mjs",
                    "preact/hooks": "/vendor/preact-hooks.mjs",
                    "htm": "/vendor/htm.mjs"
                }
            }
        </script>
        <style>
            body {
                margin: 0;
                padding: 24px;
                background: #15161e;
                color: #c0caf5;
                font:
                    14px/1.4 system-ui,
                    sans-serif;
            }

            h1,
            h2 {
                font-weight: 600;
                margin: 0 0 12px;
            }

            h2 {
                font-size: 15px;
                margin-top: 28px;
                color: #a9b1d6;
            }

            .controls {
                display: flex;
                flex-wrap: wrap;
                gap: 12px;
                align-items: center;
            }

            .controls button {
                background: #24283b;
                color: inherit;
                border: 1px solid #3b4261;
                border-radius: 6px;
                padding: 4px 10px;
                cursor: pointer;
            }

            .controls button[aria-pressed="true"] {
                border-color: #7aa2f7;
                background: #2f3549;
            }

            .grid {
                display: grid;
                grid-template-columns: 80px repeat(5, 1fr);
                gap: 8px;
                align-items: center;
                max-width: 760px;
            }

            .cell {
                display: grid;
                justify-items: center;
                gap: 4px;
                font-size: 12px;
                color: #787c99;
            }

            .crowd {
                display: flex;
                flex-wrap: wrap;
                gap: 6px;
                max-width: 760px;
            }

            .hero {
                display: flex;
                gap: 24px;
                align-items: end;
                flex-wrap: wrap;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script type="module" src="/faces/gallery.js"></script>
    </body>
</html>
